[project]
name = "ha-github-copilot"
version = "0.1.0"
description = "GitHub Copilot conversation agent and AI Task provider for Home Assistant"
requires-python = ">=3.14.2"
license = "MIT"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.372",
    "github-copilot-sdk==1.0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:copilot.*"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.github_copilot"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0917"]
